<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Your Feedback</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Share Your Feedback</h1>
      <p class="subtitle">
        Thanks for taking the time to test! Use this form to let us know what
        you noticed — bugs, rough edges, ideas, or anything else. Every piece
        of feedback helps us build a better product.
      </p>
    </header>

    <section class="submit-section">
      <form id="feedback-form" class="feedback-form">
        <div class="field">
          <label for="title">Short title</label>
          <input
            type="text"
            id="title"
            name="title"
            maxlength="80"
            placeholder="Button to submit was hard to find"
            required
          >
        </div>

        <div class="field">
          <label for="description">
            Full description <span class="optional">(optional)</span>
          </label>
          <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="If you want to say more, add it here."
          ></textarea>
        </div>

        <div class="field">
          <label for="theme">Theme</label>
          <select id="theme" name="theme" required>
            <option value="" disabled selected>Select a theme…</option>
            <option value="Bug">Bug</option>
            <option value="Usability/UX">Usability/UX</option>
            <option value="Feature Request">Feature Request</option>
            <option value="General Reaction">General Reaction</option>
          </select>
        </div>

        <div class="field">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Jane Tester"
            required
          >
        </div>

        <button type="submit" class="submit-button">Submit feedback</button>

        <div id="form-confirmation" class="form-confirmation" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
